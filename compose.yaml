name: ftp-file-synchronizer

services:
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: ftp-file-synchronizer:dev
    working_dir: /app
    environment:
      DISPLAY: ${DISPLAY}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/run/user/1000}
      ELECTRON_OZONE_PLATFORM_HINT: auto
    volumes:
      - ./:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:${XDG_RUNTIME_DIR:-/run/user/1000}
      - dev_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    user: "${UID:-1000}:${GID:-1000}"
    command: >
      sh -lc 'if [ -n "$WAYLAND_DISPLAY" ] && [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
      export ELECTRON_OZONE_PLATFORM_HINT=wayland;
      else
      export ELECTRON_OZONE_PLATFORM_HINT=auto;
      fi;
      npm start -- --no-sandbox --disable-setuid-sandbox'

  app-build:
    profiles: ["build"]
    build:
      context: .
      target: build
    image: ftp-file-synchronizer:build
    working_dir: /app
    volumes:
      - ./:/app
      - linux_node_modules:/app/node_modules
    user: "${UID:-1000}:${GID:-1000}"
    command: >
      sh -lc 'npm run dist -- --linux'

  app-build-win:
    profiles: ["build-win"]
    build:
      context: .
      target: build-win
    image: ftp-file-synchronizer:build-win
    working_dir: /app
    environment:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      WINEDEBUG: "-all"
      HOST_UID: "${UID:-1000}"
      HOST_GID: "${GID:-1000}"
    volumes:
      - ./:/app
      - windows_node_modules:/app/node_modules
    command: >
      sh -lc 'npm run dist -- --win;
      chown -R "$${HOST_UID}:$${HOST_GID}" /app/dist || true'

volumes:
  dev_node_modules:
  linux_node_modules:
  windows_node_modules:
